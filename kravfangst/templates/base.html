<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kravfångst{% endblock %} – Kravfångst</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('kravfangst.index') }}">Kravfångst</a>
    <nav>
      <a href="{{ url_for('kravfangst.index') }}">Ärenden</a>
      <a href="{{ url_for('kravfangst.goals') }}">Strategiska mål</a>
      <a class="button" href="{{ url_for('kravfangst.new_case') }}">+ Nytt behov</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<div class="flash" role="status">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
